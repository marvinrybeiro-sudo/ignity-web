<!--
IMAGENS EM CASCATA
Cole este bloco inteiro no widget HTML do Elementor/WordPress.
Não precisa de bibliotecas, Lenis ou arquivos adicionais.

PERSONALIZAR
1. No JavaScript, preencha src de cada item em IMAGENS com a URL da sua foto.
   Use fotos na proporção 16:10 (ex.: 960 x 600). Edite também o texto alt.
   Enquanto src estiver vazio, o exemplo usa ilustrações SVG leves geradas no código.
2. Edite o título e a frase dentro de .csc-copy.
3. Em .csc-section, altere as cores e --topo (ex.: 80px para um menu fixo).
4. DISTANCIA define a duração da passagem; SUAVIDADE afeta somente as imagens.
   REPETICOES mantém a espiral preenchida; VOLTAS e INCLINA_X alteram a forma 3D.
5. Pode repetir o bloco na página. Cada cópia é independente.

O movimento é vinculado ao scroll real, inclusive em wrappers. A seção usa sticky
com correção de overflow e plano B por translate3d, sem atraso na fixação.
Se não houver altura suficiente ou o visitante preferir movimento reduzido,
as imagens aparecem em uma grade estática, sem perder conteúdo.
Referência visual e geometria: HTML fornecido pelo usuário / igorfrosa.com/mediakit/.
-->
<style>
.csc-section{--topo:0px;--csc-fundo:#0d0d0e;--csc-texto:#f5f5f7;--csc-mudo:#99999f;
 position:relative;box-sizing:border-box;width:100%;color:var(--csc-texto);background:var(--csc-fundo);
 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.csc-section *, .csc-section *::before,.csc-section *::after{box-sizing:border-box}
.csc-stage{position:relative;padding:48px 24px;background:var(--csc-fundo)}
.csc-clip{position:relative}
.csc-copy{position:relative;z-index:2;width:min(100%,1180px);margin:0 auto 36px;text-align:center}
.csc-copy p{margin:0!important;color:var(--csc-mudo)!important;font:500 clamp(11px,.82vw,16px)/1.4 Arial,Helvetica,sans-serif!important;letter-spacing:.18em;text-transform:uppercase}
.csc-copy h2{margin:12px 0 0!important;color:var(--csc-texto)!important;font:600 clamp(26px,3.2vw,44px)/1.12 Arial,Helvetica,sans-serif!important;letter-spacing:-.03em}
.csc-gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;max-width:1120px;margin:0 auto}
.csc-gallery figure{margin:0;padding:0}.csc-gallery img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px}
.csc-gallery figcaption{font-size:13px;margin-top:10px;color:var(--csc-mudo)}
.csc-scene{display:none}
.csc-active .csc-stage{position:-webkit-sticky;position:sticky;top:var(--topo);height:var(--csc-altura);padding:0}
.csc-active .csc-clip{height:100%;overflow:clip}
.csc-active .csc-gallery{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%)}
.csc-active .csc-copy{position:absolute;left:50%;top:clamp(32px,7%,80px);width:calc(100% - 32px);transform:translateX(-50%);margin:0}
.csc-active .csc-scene{display:block;position:absolute;inset:0;perspective:var(--perspectiva,1300px);perspective-origin:50% 50%;pointer-events:none;--fatias:12}
.csc-eixo{position:absolute;left:50%;top:62%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.csc-cartas{position:absolute;list-style:none;margin:0!important;padding:0!important;transform-style:preserve-3d}
.csc-carta{--altura:var(--card-altura,300px);--largura:calc(var(--altura)*16/10);position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d}
.csc-tira{position:absolute;left:calc(var(--largura)/var(--fatias)/-2);top:calc(var(--altura)/-2);
 width:calc(var(--largura)/var(--fatias) + 1px);height:var(--altura);background-repeat:no-repeat;
 background-size:var(--largura) var(--altura);background-position:calc(var(--indice,0)*var(--largura)/var(--fatias)*-1) center;backface-visibility:visible}
.csc-tira[data-ponta="esquerda"]{border-top-left-radius:calc(var(--largura)*.028);border-bottom-left-radius:calc(var(--largura)*.028)}
.csc-tira[data-ponta="direita"]{width:calc(var(--largura)/var(--fatias));border-top-right-radius:calc(var(--largura)*.028);border-bottom-right-radius:calc(var(--largura)*.028)}
.csc-tira::after{content:"";position:absolute;inset:0;background:var(--csc-fundo);opacity:var(--sombra,0);pointer-events:none}
.csc-active .csc-clip::before,.csc-active .csc-clip::after{content:"";position:absolute;left:0;right:0;pointer-events:none;z-index:1}
.csc-active .csc-clip::before{top:0;height:clamp(145px,26%,320px);background:linear-gradient(to bottom,var(--csc-fundo) 0%,var(--csc-fundo) 40%,transparent 100%)}
.csc-active .csc-clip::after{bottom:0;height:clamp(80px,14%,176px);background:linear-gradient(to top,var(--csc-fundo),transparent)}
.csc-active.csc-js .csc-stage{position:relative!important;top:0!important}
.csc-mobile .csc-eixo{top:56%}
@media(hover:hover) and (pointer:fine){.csc-active .csc-stage{opacity:.999}}
@media(max-width:619px){.csc-eixo{top:56%}.csc-active .csc-clip::before{height:clamp(176px,32%,320px)}.csc-stage{padding:32px 18px}.csc-gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}}
</style>
<section class="csc-section" aria-label="Imagens em cascata no scroll">
 <div class="csc-stage"><div class="csc-clip">
  <div class="csc-scene" aria-hidden="true"><div class="csc-eixo"><ul class="csc-cartas"></ul></div></div>
  <div class="csc-copy"><p>Uma nova perspectiva</p><h2>Imagens em movimento.</h2></div>
  <div class="csc-gallery"></div>
 </div></div>
</section>

<script>
(function(){
 'use strict';
 const root=document.currentScript.previousElementSibling;
 if(!root||!root.classList.contains('csc-section'))return;
 // Cole suas URLs entre as aspas.
 const IMAGENS=[
  {src:'',alt:'Imagem 01'}, {src:'',alt:'Imagem 02'}, {src:'',alt:'Imagem 03'},
  {src:'',alt:'Imagem 04'}, {src:'',alt:'Imagem 05'}, {src:'',alt:'Imagem 06'}
 ];
 const REPETICOES=4;
 const DISTANCIA=1.35; // Percurso em alturas úteis de tela.
 const SUAVIDADE=.13; // Suavização somente da espiral; a fixação é imediata.
 const cena=root.querySelector('.csc-scene'),eixo=root.querySelector('.csc-eixo');
 const trilho=root.querySelector('.csc-stage'),copy=root.querySelector('.csc-copy');
 const lista=root.querySelector('.csc-cartas'),gallery=root.querySelector('.csc-gallery');
 const reduced=matchMedia('(prefers-reduced-motion: reduce)'),touch=matchMedia('(pointer: coarse)');
 const limitar=n=>Math.max(0,Math.min(1,n));
 // Ilustrações vetoriais embutidas: mostram a curvatura sem baixar assets externos.
 function exemplo(i){
  const cores=[['#b6cbbf','#26483e'],['#e1bd95','#88502f'],['#b6c1df','#3d4e85'],['#d4bcce','#723e67'],['#c8d3a1','#58612c'],['#c4c0b5','#595750']];
  const c=cores[i%cores.length],numero=String(i+1).padStart(2,'0');
  const svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><path fill="url(#g)" d="M0 0h960v600H0z"/><circle cx="740" cy="160" r="240" fill="none" stroke="white" stroke-opacity=".35" stroke-width="70"/><path d="M-100 580Q300 0 980 580" fill="none" stroke="white" stroke-opacity=".16" stroke-width="160"/><text x="76" y="380" font-family="Arial,sans-serif" font-size="250" font-weight="700" fill="white">'+numero+'</text><text x="88" y="493" font-family="Arial,sans-serif" font-size="30" letter-spacing="7" fill="white">SUA IMAGEM AQUI</text></svg>';
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
 }
 const imagens=IMAGENS.map((item,i)=>({src:item.src.trim()||exemplo(i),alt:item.alt||'Imagem '+(i+1)}));
 imagens.forEach(item=>{const fig=document.createElement('figure'),img=document.createElement('img'),label=document.createElement('figcaption');img.src=item.src;img.alt=item.alt;img.decoding='async';label.textContent=item.alt;fig.append(img,label);gallery.append(fig);});
 const fotos=[],cartas=[];
 for(let r=0;r<REPETICOES;r++)imagens.forEach(item=>{const li=document.createElement('li');li.className='csc-carta';lista.append(li);fotos.push(item.src);cartas.push(li);});
 if(!cartas.length)return;
   const PROPORCAO       = 16 / 10;  // largura/altura da carta
  const VAO             = 0.15;     // espaço entre cartas (em alturas)
  const RAIO_FATOR      = 0.82;
  const VOLTAS          = 3.55;     // voltas da hélice
  const PASSO_BASE      = 9.76;
  const ALT_VH          = 0.24;
  const ALT_VW          = 0.21;
  const ALT_MAX         = 264;
  const ALT_MIN         = 64;
  const PERSP_DESKTOP   = 2.216;
  const INCLINA_X       = 12.6;     // rotateX do eixo
  const INCLINA_Z       = -3.4;     // rotateZ do eixo
  const PARALLAX        = 0.13;
  const INICIO          = -7;       // progresso no topo da seção
  const FIM             = 7;        // progresso no fim da seção


  const FATIAS_DESKTOP  = 12;
  const FATIAS_MOBILE   = 7;
  const BREAKPOINT      = 620;
  const ALT_MOBILE_VW   = 0.37;
  const ALT_MOBILE_MAX  = 180;
  const PERSP_MOBILE    = 3.2;
  const PASSO_MOBILE    = 0.9;
  const ARREDONDA_ANG   = 1;


 let fatias=0,tiras=[],cacheTransform=[],cacheAng=[];
     function aplicar(ci, ti, transform, ang) {
      const el = tiras[ci][ti];
      if (cacheTransform[ci][ti] !== transform) {
        el.style.transform = transform;
        cacheTransform[ci][ti] = transform;
      }
      const a = Math.round(ang / ARREDONDA_ANG) * ARREDONDA_ANG;
      if (cacheAng[ci][ti] !== a) {
        el.style.setProperty("--sombra", ((1-Math.cos(a*Math.PI/180))/2*.42).toFixed(3));
        cacheAng[ci][ti] = a;
      }
    }

    // Cada carta vira N fatias verticais; cada fatia é girada no próprio ângulo da hélice,
    // o que "curva" a foto em volta do cilindro.
    function montarFatias(n) {
      fatias = n;
      cena.style.setProperty("--fatias", "" + n);
      tiras = cartas.map(function (carta, ci) {
        carta.textContent = "";
        const lista = [];
        for (let i = 0; i < n; i++) {
          const t = document.createElement("i");
          t.className = "csc-tira";
          t.style.backgroundImage = 'url("' + fotos[ci] + '")';
          t.style.setProperty("--indice", "" + i);
          if (i === 0) t.dataset.ponta = "esquerda";
          if (i === n - 1) t.dataset.ponta = "direita";
          carta.appendChild(t);
          lista.push(t);
        }
        return lista;
      });
      cacheTransform = cartas.map(function () { return new Array(n).fill(""); });
      cacheAng = cartas.map(function () { return new Array(n).fill(NaN); });
    }


     let raio = 0, perspectiva = 0, passo = 0, comprimento = 0, alturaHelice = 0,
        passoVoltas = PASSO_BASE, alturaCena = 0, topoEixo = 0,
        atual = INICIO;

    function medirGeometria() {
      const mobile = cena.clientWidth < BREAKPOINT; root.classList.toggle("csc-mobile", mobile);
      const n = mobile ? FATIAS_MOBILE : FATIAS_DESKTOP;
      if (n !== fatias) montarFatias(n);
      alturaCena = cena.clientHeight;
      topoEixo = eixo.offsetTop;
      const alt = mobile
        ? Math.min(Math.max(cena.clientWidth * ALT_MOBILE_VW, ALT_MIN), ALT_MOBILE_MAX)
        : Math.min(Math.max(Math.min(cena.clientHeight * ALT_VH, cena.clientWidth * ALT_VW), ALT_MIN), ALT_MAX);
      passoVoltas = mobile ? Math.max(PASSO_BASE, PASSO_MOBILE * alturaCena * VOLTAS / alt) : PASSO_BASE;
      raio = alt * PROPORCAO / RAIO_FATOR;
      passo = (PROPORCAO + VAO) * alt;
      comprimento = passo * cartas.length;
      alturaHelice = passoVoltas * alt;
      cena.style.setProperty("--card-altura", alt.toFixed(0) + "px");
      perspectiva = raio * (mobile ? PERSP_MOBILE : PERSP_DESKTOP);
      cena.style.setProperty("--perspectiva", perspectiva.toFixed(0) + "px");
      eixo.style.transform = "rotateX(" + INCLINA_X + "deg) rotateZ(" + INCLINA_Z + "deg)";
    }

    function desenhar() {
      const desloc = (0.5 - (atual - INICIO) / (FIM - INICIO)) * PARALLAX * alturaCena;
      cena.style.transform = "translateY(" + desloc.toFixed(1) + "px)";

      const metade = comprimento / 2;
      const altCarta = alturaHelice / passoVoltas;
      const largCarta = altCarta * PROPORCAO;
      const largFatia = largCarta / fatias;
      const subidaPorRad = alturaHelice / (2 * Math.PI * VOLTAS);
      const inclinacao = Math.atan(subidaPorRad / raio) * 180 / Math.PI;
      const senX = Math.sin(INCLINA_X * Math.PI / 180);
      const cosX = Math.cos(INCLINA_X * Math.PI / 180);
      const limiteAltura = alturaCena;
      const topoTrilho = 0; // Culling no espaço local: também funciona dentro de wrappers.
      const altJanela = alturaCena;
      const meio = alturaCena / 2;

      cartas.forEach(function (carta, ci) {
        const ordem = cartas.length - 1 - ci;
        const t = (-metade + ordem * passo + largCarta / 2 + atual * passo + metade) / comprimento;
        if (t < 0 || t > 1) {
          if (carta.style.visibility !== "hidden") carta.style.visibility = "hidden";
          return;
        }
        const angulo = (t - 0.5) * 360 * VOLTAS;
        const r = raio * (1 - (t - 0.5) * 0.1);
        const y = (t - 0.5) * alturaHelice;
        const meiaAbertura = largCarta / 2 / r * 180 / Math.PI;
        const angNorm = ((angulo % 360) + 540) % 360 - 180;
        const angBorda = Math.max(0, Math.abs(angNorm) - meiaAbertura);
        const zMax = r * Math.cos(angBorda * Math.PI / 180);
        const meiaAlt = altCarta / 2 + Math.abs(Math.tan(inclinacao * Math.PI / 180)) * largFatia / 2;
        const zProj = Math.max(zMax + (y - meiaAlt) * senX, zMax + (y + meiaAlt) * senX);
        const escalaBorda = perspectiva / (perspectiva - zProj);

        // Descarta cartas que encostariam na câmera ou sairiam muito da tela
        if (zProj > perspectiva * 0.82 || Math.abs(y * escalaBorda) > limiteAltura * 1.4) {
          if (carta.style.visibility !== "hidden") carta.style.visibility = "hidden";
          return;
        }
        const zCentro = r * Math.cos(angulo * Math.PI / 180);
        const yTela = y * cosX - zCentro * senX;
        const zTela = y * senX + zCentro * cosX;
        const escalaCentro = perspectiva / (perspectiva - zTela);
        const yJanela = topoTrilho + desloc + meio + (topoEixo + yTela - meio) * escalaCentro;
        const margem = (meiaAlt + subidaPorRad * largCarta / 2 / r + r * 0.06) * Math.max(escalaBorda, escalaCentro);
        if (yJanela + margem < -altJanela * 0.15 || yJanela - margem > altJanela * 1.15) {
          if (carta.style.visibility !== "hidden") carta.style.visibility = "hidden";
          return;
        }
        if (carta.style.visibility === "hidden") carta.style.visibility = "";

        for (let i = 0; i < fatias; i++) {
          const rad = (i - (fatias - 1) / 2) * largFatia / r;
          const angFatia = angulo + rad * 180 / Math.PI;
          const subida = subidaPorRad * rad;
          aplicar(ci, i,
            "translateY(" + (y + subida).toFixed(1) + "px) rotateY(" + angFatia.toFixed(2) +
            "deg) translateZ(" + r.toFixed(1) + "px) skewY(" + inclinacao.toFixed(2) + "deg)",
            angFatia);
        }
      });
    }


 let ativa=false,modoJs=false,scroller=window,topo=0,distancia=1,alturaUtil=1;
 let larguraJanela=innerWidth,alturaJanela=innerHeight,quadro=0,medicao=0,ultimo=0,destruida=false;
 let ro,io;
 function encontrarRolagem(corrigir){
  for(let p=root.parentElement;p&&p!==document.documentElement;p=p.parentElement){
   if(p===document.scrollingElement)break;
   const cs=getComputedStyle(p);
   if(/(auto|scroll|overlay)/.test(cs.overflowY)&&p.scrollHeight>p.clientHeight+1)return p;
   if(!corrigir||p.scrollHeight>p.clientHeight+1)continue;
   const x=cs.overflowX==='visible'?'visible':'clip',y=/^(hidden|clip)$/.test(cs.overflowY)?'clip':'visible';
   if(cs.overflowX!==x)p.style.setProperty('overflow-x',x,'important');
   if(cs.overflowY!==y)p.style.setProperty('overflow-y',y,'important');
  }
  return window;
 }
 function topoEsperado(){return (scroller===window?0:scroller.getBoundingClientRect().top+scroller.clientTop)+topo;}
 function progresso(){return ativa?limitar((topoEsperado()-root.getBoundingClientRect().top)/distancia):1;}
 function posicionar(){
  if(!ativa){trilho.style.transform='';return;}
  const esperado=topoEsperado(),y=esperado-root.getBoundingClientRect().top;
  if(!modoJs&&y>4&&y<distancia-4&&Math.abs(trilho.getBoundingClientRect().top-esperado)>4){modoJs=true;root.classList.add('csc-js');}
  // Não suavizar este Y: só as imagens podem ter atraso suave.
  trilho.style.transform=modoJs?'translate3d(0,'+Math.max(0,Math.min(distancia,y))+'px,0)':'';
 }
 function animar(agora){
  quadro=0;if(destruida)return;if(!root.isConnected){destruir();return;}
  posicionar();if(!ativa)return;
  const alvo=INICIO+progresso()*(FIM-INICIO),dt=ultimo?Math.min(.1,(agora-ultimo)/1000):1/60;ultimo=agora;
  atual+= (alvo-atual)*(SUAVIDADE>0?1-Math.exp(-dt/SUAVIDADE):1);
  if(Math.abs(alvo-atual)<.0005)atual=alvo;
  desenhar();
  if(atual!==alvo&&!document.hidden)quadro=requestAnimationFrame(animar);else ultimo=0;
 }
 function agendar(){if(!quadro&&!destruida)quadro=requestAnimationFrame(animar);}
 function medir(){
  medicao=0;if(destruida)return;if(!root.isConnected){destruir();return;}
  // Guarda a altura também quando load/fontes/ResizeObserver seguem a barra móvel.
  if(!(touch.matches&&innerWidth===larguraJanela&&Math.abs(innerHeight-alturaJanela)<120)){
   larguraJanela=innerWidth;alturaJanela=innerHeight;
  }
  topo=Math.max(0,parseFloat(getComputedStyle(root).getPropertyValue('--topo'))||0);
  modoJs=false;root.classList.remove('csc-js');trilho.style.transform='';
  function dimensionar(){
   const vp=scroller===window?alturaJanela:Math.min(alturaJanela,scroller.clientHeight);
   alturaUtil=Math.max(1,vp-topo);distancia=Math.max(1,alturaUtil*DISTANCIA);
   root.style.setProperty('--csc-altura',alturaUtil+'px');root.classList.add('csc-active');
   ativa=!reduced.matches&&alturaUtil>=Math.max(360,copy.offsetHeight+240)&&root.clientWidth>=200;
   root.classList.toggle('csc-active',ativa);root.classList.toggle('csc-static',!ativa);
   root.style.height=ativa?(alturaUtil+distancia)+'px':'auto';
  }
  scroller=window;dimensionar();scroller=encontrarRolagem(ativa);dimensionar();posicionar();
  if(ativa){medirGeometria();atual=INICIO+progresso()*(FIM-INICIO);desenhar();}else{cancelAnimationFrame(quadro);quadro=0;}
  agendar();
 }
 function agendarMedicao(){if(!medicao&&!destruida)medicao=requestAnimationFrame(medir);}
 function resize(){if(touch.matches&&innerWidth===larguraJanela&&Math.abs(innerHeight-alturaJanela)<120)return;agendarMedicao();}
 function visibilidade(){if(document.hidden){cancelAnimationFrame(quadro);quadro=0;ultimo=0;}else agendar();}
 function destruir(){destruida=true;cancelAnimationFrame(quadro);cancelAnimationFrame(medicao);ro.disconnect();io.disconnect();
  document.removeEventListener('scroll',agendar,true);document.removeEventListener('visibilitychange',visibilidade);
  window.removeEventListener('resize',resize);window.removeEventListener('load',agendarMedicao);reduced.removeEventListener('change',agendarMedicao);
 }
 document.addEventListener('scroll',agendar,{passive:true,capture:true});window.addEventListener('resize',resize,{passive:true});
 document.addEventListener('visibilitychange',visibilidade);window.addEventListener('load',agendarMedicao,{once:true});reduced.addEventListener('change',agendarMedicao);
 ro=new ResizeObserver(agendarMedicao);ro.observe(copy);
 for(let p=root.parentElement;p&&p!==document.body;p=p.parentElement)ro.observe(p,{box:'border-box'});
 io=new IntersectionObserver(entries=>{if(entries[0].isIntersecting)agendar();});io.observe(root);
 gallery.querySelectorAll('img').forEach(img=>img.addEventListener('load',agendarMedicao));
 if(document.fonts)document.fonts.ready.then(agendarMedicao);medir();
})();

</script>
