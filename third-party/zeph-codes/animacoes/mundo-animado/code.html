    }));
    scene.add(core);
    const halo = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 48), new THREE.ShaderMaterial({
      side: THREE.BackSide, transparent: true, depthWrite: false, blending: THREE.NormalBlending,
      vertexShader: `varying vec3 vN;varying vec3 vV;void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`,
      fragmentShader: `varying vec3 vN;varying vec3 vV;void main(){float f=pow(max(dot(-vN,vV),0.),5.5);gl_FragColor=vec4(vec3(.62,.46,.05),f*.22);}`
    }));
    scene.add(halo);
    // anéis de latitude/longitude bem sutis
    const gm = new THREE.LineBasicMaterial({ color: 0x0E0D0A, transparent: true, opacity: .06 });
    for (let la = -60; la <= 60; la += 30) { const p = []; for (let lo = 0; lo <= 360; lo += 4) p.push(ll(la, lo, 1.001)); group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), gm)); }
    for (let lo = 0; lo < 360; lo += 30) { const p = []; for (let la = -90; la <= 90; la += 4) p.push(ll(la, lo, 1.001)); group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(p), gm)); }
  }

  function arcCurve(a, b) {
    const va = ll(a.lat, a.lon, 1), vb = ll(b.lat, b.lon, 1), ang = va.angleTo(vb), h = .08 + ang / Math.PI * .36, P = [];
    const sinA = Math.sin(ang);
    for (let i = 0; i <= 48; i++) {
      const t = i / 48, s0 = Math.sin((1 - t) * ang) / sinA, s1 = Math.sin(t * ang) / sinA;
      const v = va.clone().multiplyScalar(s0).add(vb.clone().multiplyScalar(s1)).normalize();
      P.push(v.multiplyScalar(1.004 + h * Math.sin(Math.PI * t)));
    }
    return new THREE.CatmullRomCurve3(P);
  }

  function buildArcs() {
    const keys = Object.keys(CITIES).filter(k => k !== 'sp');
    keys.forEach((k, i) => {
      const main = !!CITIES[k].main;
      const geo = new THREE.TubeGeometry(arcCurve(CITIES.sp, CITIES[k]), 72, main ? .0058 : .0026, 6, false);
      const mat = new THREE.ShaderMaterial({
        transparent: true, depthWrite: false, blending: THREE.NormalBlending,
        uniforms: { uTime: { value: 0 }, uOff: { value: i * .37 }, uSp: { value: .16 + (i % 4) * .025 }, uBoost: { value: 0 }, uBase: { value: main ? .3 : .06 } },
        vertexShader: `varying float vU;void main(){vU=uv.x;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
        fragmentShader: `uniform float uTime,uOff,uSp,uBoost,uBase;varying float vU;
          void main(){float h=fract(uTime*uSp+uOff)*1.5-.25;float d=h-vU;
            float trail=smoothstep(.38,0.,d)*step(0.,d);float head=smoothstep(.025,0.,abs(d));
            float ends=smoothstep(0.,.04,vU)*smoothstep(1.,.96,vU);
            float a=(uBase+uBoost*.45+trail*(.85+uBoost)+head*1.4)*ends;
            vec3 c=mix(vec3(.62,.45,.03),vec3(.95,.76,.05),clamp(head+trail*.6,0.,1.));gl_FragColor=vec4(c,min(a,1.));}`
      });
      const m = new THREE.Mesh(geo, mat); m.userData.key = k; group.add(m); arcs.push(m);
    });
  }

  function buildMarkers() {
    const dot = new THREE.CircleGeometry(.014, 20), ring = new THREE.RingGeometry(.02, .026, 32);
    Object.keys(CITIES).forEach((k, i) => {
      const c = CITIES[k], main = !!c.main, p = ll(c.lat, c.lon, 1.006), s = k === 'sp' ? 1.9 : main ? 1.35 : .85;
      const d = new THREE.Mesh(dot, new THREE.MeshBasicMaterial({ color: k === 'sp' ? 0x0E0D0A : 0xC9990A, transparent: true, depthWrite: false }));
      d.position.copy(p); d.lookAt(p.clone().multiplyScalar(2)); d.scale.setScalar(s); group.add(d);
      const r = new THREE.Mesh(ring, new THREE.MeshBasicMaterial({ color: 0xC9990A, transparent: true, depthWrite: false, side: THREE.DoubleSide }));
      r.position.copy(p); r.lookAt(p.clone().multiplyScalar(2)); group.add(r);
      markers.push({ k, ring: r, s, ph: i * .41, pos: ll(c.lat, c.lon, 1) });
      if (c.label) {
        const el = document.createElement('div'); el.className = 'gl-label' + (main ? '' : ' gl-label--s');
        el.innerHTML = '<svg class="flag"><use href="#' + c.flag + '"/></svg>' + c.label; el.style.opacity = '0';
        host.appendChild(el); labels.push({ k, el, main, on: false, w: 0, h: 0, pos: ll(c.lat, c.lon, 1.05) });
      }
    });
  }

  function resize() {
    const r = host.getBoundingClientRect(); size = Math.max(2, r.width);
    renderer.setSize(size, size, false);
    if (pts) pts.material.uniforms.uSize.value = Math.max(2.1, size / 660 * 3.5) * renderer.getPixelRatio();
    if (!running && ready) frame(true);
  }

  const v3 = new THREE.Vector3(), camDir = new THREE.Vector3();
  function frame(once) {
    if (!once) { if (!running) return; requestAnimationFrame(() => frame()); }
    const now = performance.now(), t = (now - t0) / 1000;
    if (drag) { /* rotação guiada pelo ponteiro */ }
    else if (rotTarget !== null) {
      let d = rotTarget - rotY; d = Math.atan2(Math.sin(d), Math.cos(d)); rotY += d * .07;
      if (Math.abs(d) < .002 && now > holdUntil) rotTarget = null;
    } else { rotY += vel; vel *= .94; if (now > holdUntil && !reduced) rotY += .0016; }
    group.rotation.set(0, rotY, 0);
    pts.material.uniforms.uTime.value = reduced ? 3 : t;
    arcs.forEach(a => { a.material.uniforms.uTime.value = reduced ? 2.2 : t; const tg = a.userData.key === focusKey ? 1 : 0; a.material.uniforms.uBoost.value += (tg - a.material.uniforms.uBoost.value) * .1; });
    markers.forEach(m => { const u = reduced ? .4 : (t * .55 + m.ph) % 1; m.ring.scale.setScalar(m.s * (1 + u * 2.6)); m.ring.material.opacity = (1 - u) * .85; });
    scene.updateMatrixWorld();
    camDir.copy(camera.position).normalize();
    /* todas as etiquetas: as da frente aparecem; quando duas se encostam, fica a mais importante */
    const cand = labels.map(l => {
      v3.copy(l.pos).applyMatrix4(group.matrixWorld); const facing = v3.clone().normalize().dot(camDir);
      v3.project(camera);
      if (!l.w) { l.w = l.el.offsetWidth || 80; l.h = l.el.offsetHeight || 22; }
      const x = (v3.x * .5 + .5) * size, y = (-v3.y * .5 + .5) * size;
      return { l, x, y, f: facing, pr: (l.k === focusKey ? 5 : 0) + (l.k === 'sp' ? 4 : 0) + (l.main ? 2 : 0) + (l.on ? .6 : 0) + facing };
    }).sort((a, b) => b.pr - a.pr);
    const placed = [];
    cand.forEach(o => {
      const l = o.l, w = l.w, h = l.h; let show = false, px = o.x + 10, py = o.y - h / 2;
      if (o.f > .25) {
        // tenta: direita, esquerda, acima, abaixo
        const spots = [[o.x + 9, o.y - h / 2], [o.x - 9 - w, o.y - h / 2], [o.x - w / 2, o.y - 8 - h], [o.x - w / 2, o.y + 8]];
        for (let s = 0; s < spots.length && !show; s++) {
          const x0 = spots[s][0], y0 = spots[s][1], x1 = x0 + w, y1 = y0 + h; if (x0 < 2 || x1 > size - 2 || y0 < 2 || y1 > size - 2) continue;
          let free = true;
          for (let i = 0; i < placed.length; i++) { const q = placed[i]; if (x0 < q[2] + 3 && x1 + 3 > q[0] && y0 < q[3] + 2 && y1 + 2 > q[1]) { free = false; break; } }
          if (free) { show = true; px = x0; py = y0; placed.push([x0, y0, x1, y1]); }
        }
      }
      if (show || !l.on) l.el.style.transform = 'translate(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px)';
      if (show !== l.on) { l.on = show; l.el.style.opacity = show ? '1' : '0'; }
    });
    renderer.render(scene, camera);
  }

  let focusKey = null;
  function focus(k) {
    const c = CITIES[k]; if (!c || !ready) return; focusKey = k;
    // enquadra o meio do caminho entre São Paulo e o destino, puxando pro destino
    const mid = k === 'sp' ? c.lon : c.lon * .72 + CITIES.sp.lon * .28;
    rotTarget = -mid * D2R; holdUntil = performance.now() + 4200; vel = 0;
    if (!running) frame(true);
  }
  function blur() { focusKey = null; }

  function init(hostEl, cv, maskB64, opts) {
    host = hostEl; canvas = cv; reduced = !!(opts && opts.reduced);
    const mobile = Math.min(window.innerWidth, window.innerHeight) < 700 || document.documentElement.classList.contains('m');
    renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: !mobile, alpha: true, powerPreference: 'low-power' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.75 : 2)); renderer.setClearColor(0x000000, 0);
    scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(30, 1, .1, 50); camera.position.set(0, 0, 5.2);
    const tilt = new THREE.Group(); tilt.rotation.x = TILT; scene.add(tilt);
    group = new THREE.Group(); tilt.add(group);
    buildSphere(); buildDots(decodeMask(maskB64), mobile ? 11000 : 26000); buildArcs(); buildMarkers();
    resize();
    if ('ResizeObserver' in window) new ResizeObserver(resize).observe(host); else window.addEventListener('resize', resize);
    host.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse' && e.button !== 0) return; drag = { x: e.clientX, r: rotY, lx: e.clientX, id: e.pointerId }; rotTarget = null; vel = 0; });
    window.addEventListener('pointermove', e => { if (!drag || e.pointerId !== drag.id) return; rotY = drag.r + (e.clientX - drag.x) * .0062; vel = (e.clientX - drag.lx) * .0062; drag.lx = e.clientX; }, { passive: true });
    const end = e => { if (drag && (!e || e.pointerId === drag.id)) { drag = null; holdUntil = performance.now() + 2600; } };
    window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
    ready = true; frame(true);
  }
  return {
    init, focus, blur,
    start() { if (running || !ready) return; running = true; frame(); },
    stop() { running = false; },
    get ready() { return ready; }
  };
})(); }

  function onView(el, cb, opts) {
    if (!el) return; opts = opts || {};
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { cb(true, e); if (!opts.repeat) io.disconnect(); }
      else if (opts.repeat) cb(false, e);
    }), { threshold: opts.threshold || 0, rootMargin: opts.margin || '0px' });
    io.observe(el);
  }

  function carregarThree() {
    if (window.THREE) return Promise.resolve();
    if (!window.__dcThree) window.__dcThree = new Promise((ok, erro) => {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'; sc.async = true;
      sc.onload = ok; sc.onerror = erro; document.head.appendChild(sc);
    });
    return window.__dcThree;
  }

  function iniciar(globeBox) {
    const G = makeGlobe();
    try {
      G.init(globeBox, globeBox.querySelector('canvas'), LANDMASK, { reduced: reduced });
      onView(globeBox, on => { on ? G.start() : G.stop(); }, { repeat: true, margin: '100px' });
      document.addEventListener('visibilitychange', () => { if (document.hidden) G.stop(); else if (globeBox.getBoundingClientRect().top < innerHeight && globeBox.getBoundingClientRect().bottom > 0) G.start(); });
      let hover = false, ci = 0, seen = false;
      globeBox.addEventListener('pointerdown', () => { hover = true; G.blur(); setTimeout(() => { hover = false; }, 6000); });
      onView(globeBox, v => { seen = v; }, { repeat: true, threshold: .3 });
      if (!reduced) setInterval(() => { if (hover || !seen || document.hidden) return; G.focus(DESTAQUES[ci++ % DESTAQUES.length]); }, 4200);
      globeBox.classList.add('is-ready');
    } catch (err) { globeBox.style.display = 'none'; if (window.console) console.warn('Globo indisponível:', err); }
  }

  function preparar() {
    document.querySelectorAll('.dcg .globe').forEach(globeBox => {
      onView(globeBox, () => {
        carregarThree().then(() => iniciar(globeBox)).catch(() => { globeBox.style.display = 'none'; });
      }, { margin: '1400px' });
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', preparar, { once: true });
  else preparar();
})();
</script>
