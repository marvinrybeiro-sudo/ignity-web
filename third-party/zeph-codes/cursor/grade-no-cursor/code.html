<!--
GRADE NO CURSOR
Cole este bloco inteiro em um widget HTML do Elementor/WordPress.
CSS e JavaScript já estão incluídos. Não precisa instalar React ou bibliotecas.

PERSONALIZAR
• Troque o título e a descrição dentro de .cgc-content. Pode remover esse conteúdo
  para usar apenas o fundo, ou colocar seus próprios textos e botões dentro dele.
• Em .cgc-hero, altere --cgc-altura, --cgc-fundo e as cores RGB dos pontos.
• No JS, ajuste ESPACAMENTO, RAIO_CURSOR, FORCA, MOLA e AMORTECIMENTO.
• O canvas usa o tamanho desta seção, não o tamanho da página inteira.
• Pode repetir este bloco na mesma página: cada grade funciona separadamente.
• Toque também funciona, mantendo a rolagem vertical livre. Com movimento
  reduzido, a grade fica estática. Fora da tela, a animação é pausada.

<style>
.cgc-hero{
  --cgc-altura:560px; --cgc-fundo:#030407;
  --cgc-pontos:255,255,255; --cgc-destaque:56,189,248;
  position:relative;isolation:isolate;overflow:hidden;width:100%;min-height:300px;
  height:var(--cgc-altura);box-sizing:border-box;background:var(--cgc-fundo);
  touch-action:pan-y;cursor:crosshair;user-select:none;-webkit-user-select:none;
}
.cgc-hero *, .cgc-hero *::before, .cgc-hero *::after{box-sizing:border-box}
.cgc-canvas{position:absolute;inset:0;display:block;width:100%;height:100%;pointer-events:none}
.cgc-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;width:100%;height:100%;padding:24px;text-align:center;
  color:#fff;mix-blend-mode:difference;pointer-events:none}
.cgc-title{margin:0!important;color:inherit!important;font:900 clamp(32px,7.4vw,128px)/1 ui-monospace,SFMono-Regular,Consolas,monospace!important;
  letter-spacing:-.055em!important;text-transform:uppercase;max-width:100%;overflow-wrap:anywhere}
.cgc-description{margin:24px 0 0!important;max-width:510px;color:inherit!important;
  font:400 14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace!important;opacity:.7}
.cgc-content a,.cgc-content button{pointer-events:auto}
@media(max-width:600px){.cgc-hero{height:400px}.cgc-description{font-size:12px!important;max-width:290px}}
</style>
<section class="cgc-hero" aria-label="Fundo com grade interativa">
  <canvas class="cgc-canvas" aria-hidden="true"></canvas>
  <div class="cgc-content">
    <h2 class="cgc-title">CONSTELAÇÃO</h2>
    <p class="cgc-description">Mova o cursor pela grade.<br>Os pontos se afastam e voltam ao lugar.</p>
  </div>
</section>
<script>
(function(){
  'use strict';
  const root=document.currentScript.previousElementSibling;
  if(!root||!root.classList.contains('cgc-hero'))return;
  const canvas=root.querySelector('.cgc-canvas');
  const ctx=canvas.getContext('2d',{alpha:false});
  if(!ctx)return;

  // CONFIGURAÇÕES DO EFEITO — valores próximos ao componente original.
  const ESPACAMENTO=55;       // Distância em pixels entre os pontos.
  const RAIO_CURSOR=220;      // Alcance do cursor em pixels.
  const FORCA=1500;           // Repulsão base. A velocidade do cursor soma força.
  const MOLA=18;              // Força que puxa cada ponto de volta para a grade.
  const AMORTECIMENTO=.82;    // Mais perto de 1 = mais oscilação (use entre .6 e .95).
  const CONEXAO=75;           // Distância máxima das linhas entre pontos.
  const MOSTRAR_ROTULOS=true; // Coordenadas pequenas e círculos perto do cursor.

  const reduced=matchMedia('(prefers-reduced-motion: reduce)');
  const mouse={x:0,y:0,prevX:0,prevY:0,active:false};
  let width=0,height=0,nodes=[],raf=0,lastTime=0,accumulator=0;
  let visible=true,disposed=false,background='#030407',pointColor='255,255,255',accent='56,189,248';
  const STEP=1/60; // Passo fixo: o movimento fica igual em monitores de 60/120/144 Hz.
  let resizeObserver,intersectionObserver;

  function init(){
    if(disposed)return;
    const w=Math.round(root.clientWidth),h=Math.round(root.clientHeight);
    if(w===width&&h===height)return;
    width=w;height=h;
    if(!w||!h){stop();return;}
    const dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const style=getComputedStyle(root);
    background=style.getPropertyValue('--cgc-fundo').trim()||'#030407';
    pointColor=style.getPropertyValue('--cgc-pontos').trim()||'255,255,255';
    accent=style.getPropertyValue('--cgc-destaque').trim()||'56,189,248';
    // Limita o total de pontos em seções muito grandes.
    const spacing=Math.max(ESPACAMENTO,Math.sqrt(w*h/1000));
    nodes=[];
    for(let col=0;col<=Math.ceil(w/spacing);col++){
      for(let row=0;row<=Math.ceil(h/spacing);row++){
        const x=col*spacing,y=row*spacing;
        nodes.push({x,y,baseX:x,baseY:y,vx:0,vy:0,radius:1.2+Math.random()*1.2,
          pulse:Math.random()*Math.PI*2,label:(col*7).toString(16).toUpperCase()+':'+(row*11).toString(16).toUpperCase()});
      }
    }
    mouse.active=false;accumulator=0;draw();start();
  }
  function move(event){
    if(reduced.matches)return;
    const rect=root.getBoundingClientRect();
    const x=(event.clientX-rect.left)*width/rect.width;
    const y=(event.clientY-rect.top)*height/rect.height;
    if(!mouse.active){mouse.prevX=x;mouse.prevY=y;}
    mouse.x=x;mouse.y=y;mouse.active=true;start();
  }
  function leave(){mouse.active=false;}
  function release(event){if(event.pointerType!=='mouse')leave();}
  function step(){
    const speed=mouse.active?Math.min(50,Math.hypot(mouse.x-mouse.prevX,mouse.y-mouse.prevY)/(STEP*1000)):0;
    mouse.prevX=mouse.x;mouse.prevY=mouse.y;
    const radius=Math.min(RAIO_CURSOR,width*.48,height*.48);
    for(const n of nodes){
      n.pulse+=STEP*3;
      const dx=mouse.x-n.x,dy=mouse.y-n.y,dist=Math.hypot(dx,dy);
      if(mouse.active&&dist>0&&dist<radius){
        const force=(1-dist/radius)*(FORCA+speed*150);
        n.vx-=dx/dist*force*STEP;n.vy-=dy/dist*force*STEP;
      }
      n.vx+=(n.baseX-n.x)*MOLA*STEP;n.vy+=(n.baseY-n.y)*MOLA*STEP;
      n.vx*=AMORTECIMENTO;n.vy*=AMORTECIMENTO;
      n.x+=n.vx*STEP*60;n.y+=n.vy*STEP*60;
    }
  }
  function draw(){
    ctx.fillStyle=background;ctx.fillRect(0,0,width,height);
    // Busca por células vizinhas: evita comparar cada ponto com a grade inteira.
    const cells=new Map();
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i],key=Math.floor(n.x/CONEXAO)+','+Math.floor(n.y/CONEXAO);
      if(!cells.has(key))cells.set(key,[]);cells.get(key).push(i);
    }
    ctx.lineWidth=.7;
    for(let i=0;i<nodes.length;i++){
      const n=nodes[i],cx=Math.floor(n.x/CONEXAO),cy=Math.floor(n.y/CONEXAO);
      for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
        const neighbors=cells.get((cx+ox)+','+(cy+oy));if(!neighbors)continue;
        for(const j of neighbors){
          if(j<=i)continue;const other=nodes[j],dist=Math.hypot(n.x-other.x,n.y-other.y);
          if(dist>=CONEXAO)continue;
          ctx.strokeStyle='rgba('+pointColor+','+((1-dist/CONEXAO)*.18)+')';
          ctx.beginPath();ctx.moveTo(n.x,n.y);ctx.lineTo(other.x,other.y);ctx.stroke();
        }
      }
    }
    const radius=Math.min(RAIO_CURSOR,width*.48,height*.48);
    for(const n of nodes){
      const dist=mouse.active?Math.hypot(mouse.x-n.x,mouse.y-n.y):Infinity;
      const near=dist<radius,alpha=near?.95:.25+Math.sin(n.pulse)*.1;
      ctx.fillStyle='rgba('+(near?accent:pointColor)+','+alpha+')';
      ctx.beginPath();ctx.arc(n.x,n.y,Math.max(.5,near?n.radius*2.2:n.radius+Math.sin(n.pulse)*.3),0,Math.PI*2);ctx.fill();
      if(MOSTRAR_ROTULOS&&dist<90){
        const ring=(n.pulse*20)%30+4;
        ctx.strokeStyle='rgba('+accent+','+((1-ring/34)*.4)+')';ctx.lineWidth=1;
        ctx.beginPath();ctx.arc(n.x,n.y,ring,0,Math.PI*2);ctx.stroke();
        ctx.font='8px ui-monospace,SFMono-Regular,Consolas,monospace';ctx.fillStyle='rgba('+accent+',.85)';
        ctx.fillText(n.label,n.x+10,n.y-10);
      }
    }
  }
  function render(now){
    raf=0;
    if(!root.isConnected){dispose();return;}
    if(disposed||!visible||document.hidden||reduced.matches)return;
    accumulator+=Math.min((now-lastTime)/1000,.05);lastTime=now;
    while(accumulator>=STEP){step();accumulator-=STEP;}
    draw();raf=requestAnimationFrame(render);
  }
  function start(){
    if(!raf&&!disposed&&visible&&!document.hidden&&!reduced.matches&&width&&height){
      lastTime=performance.now();raf=requestAnimationFrame(render);
    }
  }
  function stop(){cancelAnimationFrame(raf);raf=0;accumulator=0;leave();}
  function preference(){stop();for(const n of nodes){n.x=n.baseX;n.y=n.baseY;n.vx=n.vy=0;}draw();start();}
  function visibility(){if(document.hidden)stop();else start();}
  function dispose(){
    disposed=true;stop();resizeObserver.disconnect();intersectionObserver.disconnect();
    root.removeEventListener('pointermove',move);root.removeEventListener('pointerdown',move);
    root.removeEventListener('pointerleave',leave);root.removeEventListener('pointercancel',leave);root.removeEventListener('pointerup',release);
    document.removeEventListener('visibilitychange',visibility);document.removeEventListener('scroll',leave,true);
    reduced.removeEventListener('change',preference);window.removeEventListener('load',init);
  }
  root.addEventListener('pointermove',move,{passive:true});root.addEventListener('pointerdown',move,{passive:true});
  root.addEventListener('pointerleave',leave);root.addEventListener('pointercancel',leave);root.addEventListener('pointerup',release);
  document.addEventListener('visibilitychange',visibility);document.addEventListener('scroll',leave,{passive:true,capture:true});
  reduced.addEventListener('change',preference);window.addEventListener('load',init,{once:true});
  resizeObserver=new ResizeObserver(init);
  intersectionObserver=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting;if(visible)start();else stop();});
  resizeObserver.observe(root);intersectionObserver.observe(root);init();
  if(document.fonts)document.fonts.ready.then(()=>{if(root.isConnected)init();});
})();
</script>
