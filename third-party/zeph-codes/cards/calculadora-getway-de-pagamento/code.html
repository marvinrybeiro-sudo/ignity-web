<!-- ===================================================
= LÓGICA (NÃO PRECISA MEXER)
=================================================== -->
<script>
(function () {
  const SLIDER = { min: 100000, max: 1000000, step: 1000, start: 290000 };

  const fat = document.getElementById("fat");
  const valorMostrado = document.getElementById("valorMostrado");
  const platGrid = document.getElementById("platGrid");
  const taxCustom = document.getElementById("taxCustom");
  const outrosValor = document.getElementById("outrosValor");
  const outrosTax = document.getElementById("outrosTax");
  const kupfyValor = document.getElementById("kupfyValor");
  const kupfyTax = document.getElementById("kupfyTax");

  const fmtBRL = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const parsePercent = (str) => !str ? NaN : parseFloat(String(str).replace(",", "."));

  // renderiza botões de plataformas
  function renderPlataformas() {
    platGrid.innerHTML = "";
    Object.entries(PLATAFORMAS).forEach(([key, conf]) => {
      const btn = document.createElement("button");
      btn.className = "plat";
      btn.dataset.key = key;
      btn.innerHTML = `
        <span class="logo"><img src="${conf.icon}" alt="${conf.label}"></span>
        <span>${conf.label}</span>
      `;
      platGrid.appendChild(btn);
    });
  }

  let plataformaAtiva = "perfectpay";

  function marcarAtiva(key) {
    [...platGrid.querySelectorAll(".plat")].forEach(b => {
      b.classList.toggle("active", b.dataset.key === key);
    });
  }

  function atualizar() {
    const faturamento = +fat.value;
    valorMostrado.textContent = fmtBRL(faturamento);

    const custom = parsePercent(taxCustom.value);
    const taxaOutros = isNaN(custom) ? (PLATAFORMAS[plataformaAtiva]?.taxa || 0) : custom;

    const receOutros = faturamento * (1 - taxaOutros / 100);
    const receKupfy  = faturamento * (1 - TAXA_KUPFY / 100);

    outrosValor.textContent = fmtBRL(Math.round(receOutros));
    outrosTax.textContent   = `${taxaOutros.toFixed(2)}% de taxa`;

    kupfyValor.textContent  = fmtBRL(Math.round(receKupfy));
    kupfyTax.textContent    = `${TAXA_KUPFY.toFixed(2)}% de taxa`;
  }

  // eventos
  fat.addEventListener("input", atualizar);
  taxCustom.addEventListener("input", atualizar);
  platGrid.addEventListener("click", (e) => {
    const btn = e.target.closest(".plat");
    if (!btn) return;
    plataformaAtiva = btn.dataset.key;
    marcarAtiva(plataformaAtiva);
    atualizar();
  });

  // init
  fat.min = SLIDER.min; fat.max = SLIDER.max; fat.step = SLIDER.step; fat.value = SLIDER.start;
  renderPlataformas();
  marcarAtiva(plataformaAtiva);
  atualizar();
})();
</script>

<link rel="stylesheet" href="https://unpkg.com/lenis@1.1.18/dist/lenis.css" />
<script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>

<script>
gsap.registerPlugin(ScrollTrigger);

let lenis;
function initLenisIfDesktop() {
  if (window.innerWidth > 1024 && !lenis && typeof Lenis !== "undefined") {
    lenis = new Lenis({ duration: 1.5 });

    function raf(time) {
      lenis.raf(time);
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    ScrollTrigger.scrollerProxy(document.documentElement, {
      scrollTop(value) {
        if (arguments.length) {
          lenis.scrollTo(value, { immediate: true });
        }
        return window.scrollY || window.pageYOffset;
      },
      getBoundingClientRect() {
        return {
          top: 0,
          left: 0,
          width: innerWidth,
          height: innerHeight
        };
      },
      fixedMarkers: true
    });

    lenis.on("scroll", ScrollTrigger.update);
  }
}

window.addEventListener("load", () => {
  initLenisIfDesktop();
});


if (window.matchMedia("(max-width: 1024px)").matches) {
  ScrollTrigger.normalizeScroll(true);
}

const mm = gsap.matchMedia();
const containerCards = document.querySelector(".container-cards");
const cards = document.querySelector(".cards");

let endLen = 0;
let finalX = 0;

function measure(respiroPx = 0) {
  const prev = cards.style.transform;
  cards.style.transform = "none";

  const contRect = containerCards.getBoundingClientRect();
  const lastRect = cards.lastElementChild.getBoundingClientRect();
  const padR = parseFloat(getComputedStyle(containerCards).paddingRight || 0);

  const overflowRight = lastRect.right - (contRect.right - padR);
  const need = Math.max(0, Math.ceil(overflowRight) + respiroPx);

  cards.style.transform = prev;

  endLen = need;
  finalX = -need;
}

let tl;
function build(respiroPx = 0) {
  ScrollTrigger.getAll().forEach((st) => {
    if (st.vars?.trigger === containerCards) st.kill();
  });

  gsap.set(cards, { x: 0, force3D: true, willChange: "transform" });

  measure(respiroPx);

  tl = gsap.timeline({
    scrollTrigger: {
      trigger: containerCards,
      start: "top top",
      end: () => "+=" + endLen,
      scrub: true,
      pin: true,
      pinType: window.matchMedia("(max-width: 767px)").matches
        ? "transform"
        : "fixed",
      anticipatePin: 1,
      fastScrollEnd: true,
      invalidateOnRefresh: true,
      onRefreshInit: () => gsap.set(cards, { x: 0 }),
      onRefresh: () => {
        measure(respiroPx);
        tl.scrollTrigger.end = tl.scrollTrigger.start + endLen;
      }
    }
  }).to(cards, { x: () => finalX, ease: "none", immediateRender: false });

  return tl;
}

/*ajuste onde os cards devem parar por aqui*/
mm.add("(max-width: 767px)", () => build(0)); //mobile
mm.add("(min-width: 768px) and (max-width: 1024px)", () => build(20)); //tablet
mm.add("(min-width: 1025px)", () => build(80)); //desktop

let rTO;
window.addEventListener("resize", () => {
  clearTimeout(rTO);
  rTO = setTimeout(() => {
    initLenisIfDesktop();
    ScrollTrigger.refresh();
  }, 120);
});
</script>
